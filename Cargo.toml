[package]
name = "URL-Shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
anyhow = "1.0.104"
httpc-test = "0.1.10"
